<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANEL KEY - KHỦNG LONG MOD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0B0B1A; color: #E0E0E0; padding: 20px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; }
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #2A2A4A; }
        .logo { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #FFD700, #FF6B00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo span { font-weight: 300; color: #666; -webkit-text-fill-color: #666; }
        /* Login */
        .login-box { max-width: 400px; margin: 80px auto; background: #16162E; padding: 40px; border-radius: 20px; border: 1px solid #2A2A4A; }
        .login-box h2 { text-align: center; margin-bottom: 20px; color: #FFD700; }
        .login-box input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #2A2A4A; background: #0B0B1A; color: #E0E0E0; font-size: 16px; }
        .login-box button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(135deg, #FFD700, #FF6B00); color: #0B0B1A; font-weight: 700; font-size: 18px; cursor: pointer; margin-top: 10px; }
        /* Panel */
        .panel { display: none; }
        .panel-header { display: flex; gap: 10px; flex-wrap: wrap; padding: 20px 0; }
        .panel-header .game-tab { padding: 10px 24px; border-radius: 30px; background: #16162E; border: 1px solid #2A2A4A; color: #AAA; cursor: pointer; transition: 0.3s; font-weight: 600; }
        .panel-header .game-tab.active { background: #FFD700; color: #0B0B1A; border-color: #FFD700; }
        .panel-header .game-tab:hover { background: #2A2A4A; }
        /* Cards */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0; }
        .stat-card { background: #16162E; padding: 20px; border-radius: 15px; border: 1px solid #2A2A4A; text-align: center; }
        .stat-card .num { font-size: 32px; font-weight: 700; color: #FFD700; }
        .stat-card .label { font-size: 13px; color: #888; margin-top: 5px; }
        /* Form */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: #16162E; padding: 25px; border-radius: 15px; border: 1px solid #2A2A4A; margin: 20px 0; }
        .form-grid input, .form-grid select { padding: 12px; border-radius: 10px; border: 1px solid #2A2A4A; background: #0B0B1A; color: #E0E0E0; font-size: 14px; }
        .form-grid button { padding: 12px 20px; border: none; border-radius: 10px; background: linear-gradient(135deg, #4CAF50, #2E7D32); color: #fff; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .form-grid button:hover { transform: scale(1.02); }
        .form-grid .btn-danger { background: linear-gradient(135deg, #F44336, #C62828); }
        /* Key list */
        .key-list { background: #16162E; border-radius: 15px; border: 1px solid #2A2A4A; overflow: hidden; margin: 20px 0; }
        .key-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid #0B0B1A; flex-wrap: wrap; gap: 8px; }
        .key-item:last-child { border-bottom: none; }
        .key-item .info { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .key-item .info .key-text { font-weight: 700; color: #FFD700; font-size: 16px; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-vip { background: #FFD700; color: #0B0B1A; }
        .badge-free { background: #4CAF50; color: #fff; }
        .badge-free_once { background: #2196F3; color: #fff; }
        .badge-test { background: #9C27B0; color: #fff; }
        .badge-expired { background: #F44336; color: #fff; }
        .key-item .actions button { padding: 6px 14px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; margin-left: 5px; }
        .btn-delete { background: #F44336; color: #fff; }
        .btn-edit { background: #FF9800; color: #fff; }
        .empty { padding: 30px; text-align: center; color: #666; }
        /* Responsive */
        @media (max-width: 600px) { .header { flex-direction: column; gap: 10px; } .form-grid { grid-template-columns: 1fr; } .key-item { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- LOGIN -->
    <div class="login-box" id="loginBox">
        <h2>🔑 PANEL ADMIN</h2>
        <input type="text" id="loginUser" placeholder="Tài khoản" value="YonkiVNOfficial">
        <input type="password" id="loginPass" placeholder="Mật khẩu" value="yonkivnofficial">
        <button onclick="login()">ĐĂNG NHẬP</button>
        <p style="text-align:center;color:#666;font-size:12px;margin-top:15px;">© Khủng Long Mod - @adkhunglongmodgame</p>
    </div>

    <!-- PANEL -->
    <div class="panel" id="panel">
        <div class="header">
            <div class="logo">🦖 KHỦNG LONG <span>PANEL</span></div>
            <div style="display:flex;gap:10px;align-items:center;">
                <span id="userDisplay" style="color:#FFD700;font-weight:600;">YonkiVNOfficial</span>
                <button onclick="logout()" style="background:#F44336;border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;">Đăng xuất</button>
            </div>
        </div>

        <!-- Game Tabs -->
        <div class="panel-header" id="gameTabs">
            <div class="game-tab active" data-game="ff" onclick="switchGame('ff')">🔥 Free Fire</div>
            <div class="game-tab" data-game="lq" onclick="switchGame('lq')">⚔️ Liên Quân</div>
            <div class="game-tab" data-game="rov" onclick="switchGame('rov')">🏹 ROV</div>
            <div class="game-tab" onclick="addGame()">➕ Thêm Game</div>
        </div>

        <!-- Stats -->
        <div class="stats" id="stats">
            <div class="stat-card"><div class="num" id="totalKeys">0</div><div class="label">Tổng Key</div></div>
            <div class="stat-card"><div class="num" id="activeKeys">0</div><div class="label">Đang hoạt động</div></div>
            <div class="stat-card"><div class="num" id="usedKeys">0</div><div class="label">Đã sử dụng</div></div>
        </div>

        <!-- Create Form -->
        <div class="form-grid">
            <input type="text" id="keyPrefix" placeholder="Key (VD: FF-VIP-001)">
            <select id="keyType">
                <option value="vip">VIP (Vô hạn thiết bị)</option>
                <option value="free">FREE (3 thiết bị - 7 ngày)</option>
                <option value="free_once" selected>FREE 1 LẦN (1 thiết bị - 12h)</option>
                <option value="test">TEST (999 thiết bị - 30 ngày)</option>
            </select>
            <input type="datetime-local" id="keyExpiry" placeholder="Hạn sử dụng">
            <input type="number" id="deviceLimit" placeholder="Giới hạn TB (0=không giới hạn)" value="1">
            <button onclick="createKey()">➕ Tạo Key</button>
            <button class="btn-danger" onclick="bulkCreate()">📦 Tạo Hàng Loạt (10 key FREE 1 LẦN)</button>
        </div>

        <!-- Key List -->
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;">
            <h3>📋 Danh sách key</h3>
            <div>
                <button onclick="exportJSON()" style="background:#333;border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;">📤 Xuất JSON</button>
                <button onclick="uploadGitHub()" style="background:#4CAF50;border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;">⬆️ Cập nhật GitHub</button>
            </div>
        </div>
        <div class="key-list" id="keyList">
            <div class="empty">Chưa có key nào. Hãy tạo key đầu tiên!</div>
        </div>
    </div>
</div>

<script>
    const ACCOUNTS = { "YonkiVNOfficial": "yonkivnofficial" };
    let currentGame = 'ff';
    let data = {
        active: true,
        games: {
            ff: { name: "Free Fire", keys: {} },
            lq: { name: "Liên Quân", keys: {} },
            rov: { name: "ROV", keys: {} }
        }
    };

    // Login
    function login() {
        const user = document.getElementById('loginUser').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        if (ACCOUNTS[user] && ACCOUNTS[user] === pass) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('panel').style.display = 'block';
            document.getElementById('userDisplay').textContent = user;
            loadData();
        } else {
            alert('❌ Sai tài khoản hoặc mật khẩu!');
        }
    }

    function logout() {
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('panel').style.display = 'none';
    }

    // Load data from localStorage or default
    function loadData() {
        const saved = localStorage.getItem('khunglong_data');
        if (saved) {
            try { data = JSON.parse(saved); } catch(e) {}
        }
        renderKeys();
        updateStats();
    }

    function saveData() {
        localStorage.setItem('khunglong_data', JSON.stringify(data));
    }

    // Switch game
    function switchGame(game) {
        currentGame = game;
        document.querySelectorAll('.game-tab').forEach(el => el.classList.remove('active'));
        document.querySelector(`.game-tab[data-game="${game}"]`).classList.add('active');
        renderKeys();
        updateStats();
    }

    // Create key
    function createKey() {
        const prefix = document.getElementById('keyPrefix').value.trim() || generateKey();
        const type = document.getElementById('keyType').value;
        const expiryInput = document.getElementById('keyExpiry').value;
        let deviceLimit = parseInt(document.getElementById('deviceLimit').value) || 0;

        // Auto set expiry
        let expiry = 0;
        if (expiryInput) {
            expiry = new Date(expiryInput).getTime();
        } else {
            const now = Date.now();
            switch(type) {
                case 'vip': expiry = now + 365 * 24 * 60 * 60 * 1000; break;
                case 'free': expiry = now + 7 * 24 * 60 * 60 * 1000; break;
                case 'free_once': expiry = now + 12 * 60 * 60 * 1000; break;
                case 'test': expiry = now + 30 * 24 * 60 * 60 * 1000; break;
                default: expiry = now + 30 * 24 * 60 * 60 * 1000;
            }
        }

        if (deviceLimit === 0) {
            if (type === 'vip') deviceLimit = 999;
            else if (type === 'free') deviceLimit = 3;
            else if (type === 'free_once') deviceLimit = 1;
            else deviceLimit = 999;
        }

        const keyData = {
            type: type,
            expiry: expiry,
            device_limit: deviceLimit,
            used_devices: []
        };

        if (!data.games[currentGame]) {
            data.games[currentGame] = { name: currentGame.toUpperCase(), keys: {} };
        }
        data.games[currentGame].keys[prefix] = keyData;
        saveData();
        renderKeys();
        updateStats();
        document.getElementById('keyPrefix').value = '';
        alert(`✅ Đã tạo key: ${prefix} (${type})`);
    }

    function bulkCreate() {
        for (let i = 0; i < 10; i++) {
            const key = 'FREE-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            const now = Date.now();
            if (!data.games[currentGame]) data.games[currentGame] = { name: currentGame.toUpperCase(), keys: {} };
            data.games[currentGame].keys[key] = {
                type: 'free_once',
                expiry: now + 12 * 60 * 60 * 1000,
                device_limit: 1,
                used_devices: []
            };
        }
        saveData();
        renderKeys();
        updateStats();
        alert('✅ Đã tạo 10 key FREE 1 LẦN (hạn 12h)!');
    }

    function generateKey() {
        return currentGame.toUpperCase() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    // Render
    function renderKeys() {
        const container = document.getElementById('keyList');
        const gameData = data.games[currentGame];
        if (!gameData || Object.keys(gameData.keys).length === 0) {
            container.innerHTML = '<div class="empty">Chưa có key nào cho game này.</div>';
            return;
        }

        let html = '';
        const now = Date.now();
        const entries = Object.entries(gameData.keys);
        entries.sort((a, b) => a[0].localeCompare(b[0]));

        for (const [key, val] of entries) {
            const isExpired = val.expiry > 0 && now > val.expiry;
            const used = val.used_devices ? val.used_devices.length : 0;
            const limit = val.device_limit || 0;
            const typeLabel = val.type === 'vip' ? 'VIP' :
                              val.type === 'free_once' ? 'FREE 1 LẦN' :
                              val.type === 'free' ? 'FREE' : 'TEST';
            const badgeClass = val.type === 'vip' ? 'badge-vip' :
                               val.type === 'free_once' ? 'badge-free_once' :
                               val.type === 'free' ? 'badge-free' : 'badge-test';
            if (isExpired) {
                html += `<div class="key-item" style="opacity:0.5;">
                    <div class="info">
                        <span class="key-text">${key}</span>
                        <span class="badge ${badgeClass}">${typeLabel}</span>
                        <span>🔴 Hết hạn</span>
                        <span>${used}/${limit === 0 ? '∞' : limit} TB</span>
                    </div>
                    <div class="actions">
                        <button class="btn-delete" onclick="deleteKey('${key}')">🗑️</button>
                    </div>
                </div>`;
            } else {
                html += `<div class="key-item">
                    <div class="info">
                        <span class="key-text">${key}</span>
                        <span class="badge ${badgeClass}">${typeLabel}</span>
                        <span>🟢 ${new Date(val.expiry).toLocaleString('vi-VN')}</span>
                        <span>${used}/${limit === 0 ? '∞' : limit} TB</span>
                    </div>
                    <div class="actions">
                        <button class="btn-edit" onclick="editKey('${key}')">✏️</button>
                        <button class="btn-delete" onclick="deleteKey('${key}')">🗑️</button>
                    </div>
                </div>`;
            }
        }
        container.innerHTML = html;
    }

    function updateStats() {
        const gameData = data.games[currentGame];
        if (!gameData) {
            document.getElementById('totalKeys').textContent = '0';
            document.getElementById('activeKeys').textContent = '0';
            document.getElementById('usedKeys').textContent = '0';
            return;
        }
        const keys = gameData.keys;
        const total = Object.keys(keys).length;
        const now = Date.now();
        let active = 0, used = 0;
        for (const k of Object.values(keys)) {
            if (k.expiry === 0 || now < k.expiry) active++;
            if (k.used_devices && k.used_devices.length > 0) used++;
        }
        document.getElementById('totalKeys').textContent = total;
        document.getElementById('activeKeys').textContent = active;
        document.getElementById('usedKeys').textContent = used;
    }

    function deleteKey(key) {
        if (!confirm(`Xóa key "${key}"?`)) return;
        delete data.games[currentGame].keys[key];
        saveData();
        renderKeys();
        updateStats();
    }

    function editKey(key) {
        const val = data.games[currentGame].keys[key];
        const newLimit = prompt('Giới hạn thiết bị mới (0=không giới hạn):', val.device_limit);
        if (newLimit !== null) {
            val.device_limit = parseInt(newLimit) || 0;
            saveData();
            renderKeys();
        }
    }

    function addGame() {
        const name = prompt('Tên game mới (vd: pubg):');
        if (name && name.trim()) {
            const id = name.trim().toLowerCase();
            data.games[id] = { name: name.trim().toUpperCase(), keys: {} };
            saveData();
            // Thêm tab mới
            const tabs = document.getElementById('gameTabs');
            const tab = document.createElement('div');
            tab.className = 'game-tab';
            tab.dataset.game = id;
            tab.textContent = '🎮 ' + name.trim().toUpperCase();
            tab.onclick = () => switchGame(id);
            tabs.insertBefore(tab, tabs.lastElementChild);
            switchGame(id);
        }
    }

    // Export JSON
    function exportJSON() {
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'keys.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function uploadGitHub() {
        alert('📋 Copy JSON sau đây và dán vào file keys.json trên GitHub:\n\n' +
              JSON.stringify(data, null, 2) + '\n\n' +
              '1. Vào repository khunglongkey\n' +
              '2. Mở file keys.json\n' +
              '3. Paste và Commit');
    }

    // Auto login with demo
    window.onload = function() {
        if (localStorage.getItem('khunglong_logged')) {
            document.getElementById('loginUser').value = 'YonkiVNOfficial';
            document.getElementById('loginPass').value = 'yonkivnofficial';
            login();
        }
    };
</script>
</body>
</html>
